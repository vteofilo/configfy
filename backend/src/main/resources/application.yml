spring:
  application:
    name: configfyapi
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/configfyrealm/protocol/openid-connect/certs
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/configfydb}
    user: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:password}
    schemas: public
    validate-on-migrate: true

jwt:
  auth:
    converter:
      resource-id: my-client
      principal-attribute: principal_username

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG